name: Size Limit

on:
  pull_request:
    branches: [master, main]

jobs:
  size:
    name: Bundle size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Bundle size is a headline claim for this package — a regression here
      # is a real regression, not a nit.
      - name: Check size limits
        run: npm run size
